  pl: { pvp:'2 Graczy', pvc:'vs Computer', you:'Ty', ai:'Komputer', black:'Czarny', white:'Biały',
        turn:'Ruch', thinking:'Komputer myśli…', wins:'wygrywa!', opens:'zaczyna',

let currentLang='de';
function t(k){ return LANGS[currentLang][k]||LANGS.de[k]; }
function setLang(l){
  currentLang=l; document.documentElement.lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('lang-'+l).classList.add('active');
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent=t(el.dataset.t); });
  updateModeButtons(); updateStatus();
}
function updateModeButtons(){
  document.querySelector('#btn-pvp span').textContent=t('pvp');
  document.querySelector('#btn-pvc span').textContent=t('pvc');
}
function playerLabel(p){ if(mode==='pvc')return p===BLACK?t('you'):t('ai'); return p===BLACK?t('black'):t('white'); }
function playerIcon(p){ return p===BLACK?'⚫':'⚪'; }
function updateStatus(){

  if(winner){
    const nx=winner===BLACK?WHITE:BLACK;
    el.textContent=`🏆 ${playerIcon(winner)} ${playerLabel(winner)} ${t('wins')} — ${playerIcon(nx)} ${playerLabel(nx)} ${t('opens')}`;
    el.className='status win';
  } else if(thinking){
    const icon = aiMode==='simple'?'🎯':aiMode==='master'?'👑':'🎨';
    el.textContent=`${icon} ${t('thinking')}`;
    el.className='status';
  } else {
    el.textContent=`${t('turn')}: ${playerIcon(current)} ${playerLabel(current)}`;
    el.className='status';
  }
  document.getElementById('board-wrap').className=winner?'done':thinking?'thinking':'';
  document.getElementById('score-b').textContent=scoreB;
  document.getElementById('score-w').textContent=scoreW;
  document.getElementById('score-b').className='score-num'+(winner===BLACK?' winner':'');
  document.getElementById('score-w').className='score-num'+(winner===WHITE?' winner':'');
  document.getElementById('label-b').textContent='⚫ '+playerLabel(BLACK);
  document.getElementById('label-w').textContent='⚪ '+playerLabel(WHITE);
}

// ── Game constants ────────────────────────────────────────────────────────────
const SIZE=15,EMPTY=0,BLACK=1,WHITE=2,WIN=5,DEPTH=3,MAX_CANDS=15;
let board,current,winner,winLine,lastMove,thinking,moveCount;
let scoreB=0,scoreW=0,starter=BLACK,mode='pvc',aiMode='simple',speed='slow';
let CELL,PAD,STONE,BP,boardPx,aiTimer=null;

function setAI(m){
  aiMode=m;
  ['simple','master','creative'].forEach(x=>{
    document.getElementById('ai-'+x).className='ai-btn'+(m===x?' active':'');
  });
  const speedRow=document.getElementById('speed-row');
  speedRow.style.opacity=m==='simple'?'0.3':'1';
  speedRow.style.pointerEvents=m==='simple'?'none':'auto';
  resetGame();
}
function setSpeed(s){
  speed=s;
  document.getElementById('spd-fast').className='speed-btn'+(s==='fast'?' active':'');
  document.getElementById('spd-slow').className='speed-btn'+(s==='slow'?' active':'');
}
function getTimeMs(){ return aiMode==='simple'?80:speed==='fast'?300:1000; }

// ── Opening Book (real Gomoku master openings) ────────────────────────────────
// Format: array of [r,c] moves alternating BLACK, WHITE from center
const OPENINGS = [
  [[7,7],[7,8],[7,6],[8,7],[6,7],[8,8],[6,6]],           // diagonal spread
  [[7,7],[6,7],[8,7],[7,6],[7,8],[6,6],[8,8]],           // cross + diagonal
  [[7,7],[7,6],[7,8],[6,7],[8,7],[5,7],[9,7]],           // vertical pressure
  [[7,7],[8,8],[6,6],[8,6],[6,8],[9,7],[5,7]],           // asymmetric
  [[7,7],[6,8],[8,6],[6,6],[8,8],[5,9],[9,5]],           // sharp diagonal
  [[7,7],[7,8],[8,7],[6,8],[8,6],[5,7],[9,7]],           // center control
  [[7,7],[8,7],[7,8],[9,7],[7,6],[10,7],[7,5]],          // vertical chain
  [[7,7],[6,6],[8,8],[6,8],[8,6],[5,5],[9,9]],           // pure diagonal
];
let currentOpening=null, openingIdx=0;

function pickOpening(){ currentOpening=OPENINGS[Math.floor(Math.random()*OPENINGS.length)]; openingIdx=0; }

function getOpeningMove(b, moveNum){
  if(!currentOpening||moveNum>=currentOpening.length) return null;
  // opening moves are for WHITE (index 1,3,5... = WHITE moves after BLACK opens)
  // moveNum = total stones on board, WHITE moves at odd counts
  const [r,c]=currentOpening[moveNum];
  if(b[r][c]===EMPTY) return [r,c];
  return null; // opening position taken, fall through to minimax
}

// ── MCTS ─────────────────────────────────────────────────────────────────────
class MCTSNode {
  constructor(board, move, parent, player){
    this.board=board.map(r=>[...r]);
    this.move=move; this.parent=parent; this.player=player;
    this.children=[]; this.wins=0; this.visits=0; this.untriedMoves=null;
  }
  ucb1(c=1.4){
    if(this.visits===0)return Infinity;
    return this.wins/this.visits + c*Math.sqrt(Math.log(this.parent.visits)/this.visits);
  }
}

function mctsGetMoves(b, player){
  const opp=player===BLACK?WHITE:BLACK;
  const seen=new Uint8Array(SIZE*SIZE),out=[];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(b[r][c]===EMPTY)continue;
    for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++){
      if(!dr&&!dc)continue;
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==EMPTY)continue;
      const i=nr*SIZE+nc; if(!seen[i]){seen[i]=1;out.push([nr,nc]);}
    }
  }
  if(!out.length)return[[7,7]];
  // score and limit candidates
  const sc=out.map(([r,c])=>({r,c,s:Math.max(quickScore(b,r,c,player),quickScore(b,r,c,opp)*1.1)}));
  sc.sort((a,b)=>b.s-a.s);
  return sc.slice(0,10).map(({r,c})=>[r,c]);
}

function quickScore(b,r,c,p){
  const opp=p===BLACK?WHITE:BLACK,dirs=[[1,0],[0,1],[1,1],[1,-1]];
  let s=0;
  for(const[dr,dc]of dirs){
    let n=0,nr=r+dr,nc=c+dc;
    while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===p){n++;nr+=dr;nc+=dc;}
    nr=r-dr;nc=c-dc;
    while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===p){n++;nr-=dr;nc-=dc;}
    s+=n>=4?10000:n===3?500:n===2?50:n;
  }
  return s;
}

function mctsSimulate(b, player){
  // lightweight random playout with bias toward good moves
  let cur=player, p=[...b.map(r=>[...r])];
  for(let i=0;i<20;i++){
    const moves=mctsGetMoves(p,cur).slice(0,6);
    if(!moves.length)break;
    const[r,c]=moves[Math.floor(Math.random()*Math.min(3,moves.length))];
    p[r][c]=cur;
    if(checkWin(p,r,c,cur))return cur;
    cur=cur===BLACK?WHITE:BLACK;
  }
  // evaluate position
  return evalBoard(p,WHITE)>0?WHITE:BLACK;
}

function mcts(board, aiPlayer, timeMs){
  const root=new MCTSNode(board,null,null,aiPlayer===BLACK?WHITE:BLACK);
  root.untriedMoves=mctsGetMoves(board,aiPlayer);
  const deadline=Date.now()+timeMs;
  let iters=0;
  while(Date.now()<deadline){
    // Selection
    let node=root;
    while(node.untriedMoves!==null&&node.untriedMoves.length===0&&node.children.length>0){
      node=node.children.reduce((a,b)=>a.ucb1()>b.ucb1()?a:b);
    }
    // Expansion
    if(node.untriedMoves===null) node.untriedMoves=mctsGetMoves(node.board, aiPlayer);
    if(node.untriedMoves.length>0){
      const idx=Math.floor(Math.random()*node.untriedMoves.length);
      const[r,c]=node.untriedMoves.splice(idx,1)[0];
      const nb=node.board.map(x=>[...x]);
      const nextP=node.player===BLACK?WHITE:BLACK;
      nb[r][c]=nextP;
      const child=new MCTSNode(nb,[r,c],node,nextP);
      child.untriedMoves=checkWin(nb,r,c,nextP)?[]:mctsGetMoves(nb,nextP===BLACK?WHITE:BLACK);
      node.children.push(child);
      node=child;
    }
    // Simulation
    let result;
    if(node.move&&checkWin(node.board,node.move[0],node.move[1],node.player)){
      result=node.player;
    } else {
      result=mctsSimulate(node.board,node.player===BLACK?WHITE:BLACK);
    }
    // Backpropagation
    let n=node;
    while(n){
      n.visits++;
      if(n.player!==result) n.wins++; // win for the player who MADE the move
      n=n.parent;
    }
    iters++;
  }
  if(!root.children.length) return getCandidates(board,aiPlayer)[0];
  const best=root.children.reduce((a,b)=>a.visits>b.visits?a:b);
  return best.move;
}

// ── Minimax ───────────────────────────────────────────────────────────────────
function threatAtCell(b,r,c,player){
  const opp=player===BLACK?WHITE:BLACK,dirs=[[1,0],[0,1],[1,1],[1,-1]];
  let total=0;
  for(const[dr,dc]of dirs){
    let cF=0,cB=0,oF=0,oB=0,sF=1,sB=0;
    let nr=r+dr,nc=c+dc;
    while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===player){cF++;sF++;nr+=dr;nc+=dc;}
    if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===EMPTY){oF=1;sF++;}
    nr=r-dr;nc=c-dc;
    while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===player){cB++;sB++;nr-=dr;nc-=dc;}
    if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===EMPTY){oB=1;sB++;}
    if(sF+sB<WIN)continue;
    const tv=cF+cB+1,oe=oF+oB;
    if(tv>=5)total+=100000;
    else if(tv===4&&oe===2)total+=10000;
    else if(tv===4&&oe===1)total+=5000;
    else if(tv===3&&oe===2)total+=1000;
    else if(tv===3&&oe===1)total+=200;
  }
  return total;
}
function cellScore(b,r,c,player){
  const opp=player===BLACK?WHITE:BLACK,dirs=[[1,0],[0,1],[1,1],[1,-1]];
  let score=0;
  for(const[dr,dc]of dirs){
    let mine=0,oA=0,oB=0,sp=1;
    let nr=r+dr,nc=c+dc;
    while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===player){mine++;sp++;nr+=dr;nc+=dc;}
    if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]!==opp&&b[nr][nc]!==player){oA=1;sp++;}
    nr=r-dr;nc=c-dc;
    while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===player){mine++;sp++;nr-=dr;nc-=dc;}
    if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]!==opp&&b[nr][nc]!==player){oB=1;sp++;}
    if(sp<WIN)continue;
    const tv=mine+1,oe=oA+oB;
    if(tv>=5)score+=100000;
    else if(tv===4&&oe===2)score+=50000;
    else if(tv===4&&oe===1)score+=8000;
    else if(tv===3&&oe===2)score+=8000;
    else if(tv===3&&oe===1)score+=1000;
    else if(tv===2&&oe===2)score+=500;
    else if(tv===2&&oe===1)score+=100;
    else score+=10;
  }
  return score;
}
function getCandidates(b,aiP){
  const opp=aiP===BLACK?WHITE:BLACK,seen=new Uint8Array(SIZE*SIZE),out=[],dirs4=[[1,0],[0,1],[1,1],[1,-1]];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(b[r][c]===EMPTY)continue;
    for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++){
      if(!dr&&!dc)continue;
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==EMPTY)continue;
      const i=nr*SIZE+nc;if(!seen[i]){seen[i]=1;out.push([nr,nc]);}
    }
    for(const[dr,dc]of dirs4){
      let nr=r+dr,nc=c+dc;
      while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===b[r][c]){nr+=dr;nc+=dc;}
      if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===EMPTY){const i=nr*SIZE+nc;if(!seen[i]){seen[i]=1;out.push([nr,nc]);}}
      nr=r-dr;nc=c-dc;
      while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===b[r][c]){nr-=dr;nc-=dc;}
      if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===EMPTY){const i=nr*SIZE+nc;if(!seen[i]){seen[i]=1;out.push([nr,nc]);}}
    }
  }
  if(!out.length)return[[7,7]];
  const sc=out.map(([r,c])=>({r,c,s:Math.max(cellScore(b,r,c,aiP),cellScore(b,r,c,opp)*1.1)}));
  sc.sort((a,b)=>b.s-a.s);
  return sc.slice(0,MAX_CANDS).map(({r,c})=>[r,c]);
}
const ST=[[0,0,0],[0,1,5],[0,50,500],[0,500,8000],[0,5000,50000],[100000,100000,100000]];
function evalDir(b,r,c,dr,dc,p){
  const opp=p===BLACK?WHITE:BLACK;let mine=1,oe=0,sp=1;
  let nr=r+dr,nc=c+dc;
  while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===p){mine++;sp++;nr+=dr;nc+=dc;}
  if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===EMPTY){oe++;sp++;}
  nr=r-dr;nc=c-dc;
  while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===p){mine++;sp++;nr-=dr;nc-=dc;}
  if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===EMPTY){oe++;sp++;}
  if(sp<WIN)return 0;
  return ST[Math.min(mine,5)][oe];
}
function evalBoard(b,aiP){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];let score=0;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(b[r][c]===EMPTY)continue;
    const p=b[r][c],mul=p===aiP?1:-1.1;
    for(const[dr,dc]of dirs){
      const pr=r-dr,pc=c-dc;
      if(pr>=0&&pr<SIZE&&pc>=0&&pc<SIZE&&b[pr][pc]===p)continue;
      score+=mul*evalDir(b,r,c,dr,dc,p);
    }
  }
  return score;
}
function minimax(b,depth,alpha,beta,max,aiP,lR,lC,lP){
  if(lR!==null&&checkWin(b,lR,lC,lP))return max?-200000-depth:200000+depth;
  if(depth===0)return evalBoard(b,aiP);
  const cur=max?aiP:(aiP===BLACK?WHITE:BLACK);
  const cands=getCandidates(b,aiP);
  if(max){
    let best=-Infinity;
    for(const[r,c]of cands){b[r][c]=cur;const v=minimax(b,depth-1,alpha,beta,false,aiP,r,c,cur);b[r][c]=EMPTY;if(v>best)best=v;if(v>alpha)alpha=v;if(beta<=alpha)break;}
    return best;
  } else {
    let best=Infinity;
    for(const[r,c]of cands){b[r][c]=cur;const v=minimax(b,depth-1,alpha,beta,true,aiP,r,c,cur);b[r][c]=EMPTY;if(v<best)best=v;if(v<beta)beta=v;if(beta<=alpha)break;}
    return best;
  }
}

// ── Core AI logic ─────────────────────────────────────────────────────────────
function checkWin(b,r,c,p){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    let n=1;
    for(let s=1;s<WIN;s++){const nr=r+dr*s,nc=c+dc*s;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==p)break;n++;}
    for(let s=1;s<WIN;s++){const nr=r-dr*s,nc=c-dc*s;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==p)break;n++;}
    if(n>=WIN)return true;
  }
  return false;
}
function getWinLine(b,r,c,p){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    let cells=[[r,c]];
    for(let s=1;s<WIN;s++){const nr=r+dr*s,nc=c+dc*s;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==p)break;cells.push([nr,nc]);}
    for(let s=1;s<WIN;s++){const nr=r-dr*s,nc=c-dc*s;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==p)break;cells.push([nr,nc]);}
    if(cells.length>=WIN)return cells;
  }
  return null;
}

function computeMinimaxMove(b,aiP){
  const opp=aiP===BLACK?WHITE:BLACK;
  let sc=0;for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(b[r][c]!==EMPTY)sc++;
  if(sc===0)return[7,7];
  const cands=getCandidates(b,aiP);
  for(const[r,c]of cands){b[r][c]=aiP;const w=checkWin(b,r,c,aiP);b[r][c]=EMPTY;if(w)return[r,c];}
  for(const[r,c]of cands){b[r][c]=opp;const w=checkWin(b,r,c,opp);b[r][c]=EMPTY;if(w)return[r,c];}
  let bB=null,bBt=0;
  for(const[r,c]of cands){const tv=threatAtCell(b,r,c,opp);if(tv>=5000&&tv>bBt){bBt=tv;bB=[r,c];}}
  if(bB)return bB;
  for(const[r,c]of cands){const tv=threatAtCell(b,r,c,aiP);if(tv>=5000)return[r,c];}
  let bF=null,bFt=0;
  for(const[r,c]of cands){const tv=threatAtCell(b,r,c,opp);if(tv>=2000&&tv>bFt){bFt=tv;bF=[r,c];}}
  if(bF)return bF;
  for(const[r,c]of cands){const tv=threatAtCell(b,r,c,aiP);if(tv>=2000)return[r,c];}
  if(sc<=3){
    let best=null,bs=-Infinity;
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      if(b[r][c]!==opp)continue;
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
        if(!dr&&!dc)continue;
        const nr=r+dr,nc=c+dc;
        if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==EMPTY)continue;
        const s=-(Math.abs(nr-7)+Math.abs(nc-7))+Math.random()*1.5;
        if(s>bs){bs=s;best=[nr,nc];}
      }
    }
    if(best)return best;
  }
  let bT=null,bTt=0;
  for(const[r,c]of cands){const tv=threatAtCell(b,r,c,opp);if(tv>=1000&&tv>bTt){bTt=tv;bT=[r,c];}}
  let bestS=-Infinity,bestM=cands[0];
  for(const[r,c]of cands){
    b[r][c]=aiP;
    const s=minimax(b,DEPTH-1,-Infinity,Infinity,false,aiP,r,c,aiP);
    b[r][c]=EMPTY;if(s>bestS){bestS=s;bestM=[r,c];}
  }
  if(bT&&bestS<3000)return bT;
  return bestM;
}

function computeAIMove(b, aiP){
  const sc = b.reduce((n,r)=>n+r.filter(c=>c!==EMPTY).length, 0);

  if(aiMode==='simple'){
    return computeMinimaxMove(b, aiP);
  }

  if(aiMode==='master'){
    // Use opening book for first moves
    const om=getOpeningMove(b, sc);
    if(om) return om;
    // Fall through to strong minimax
    return computeMinimaxMove(b, aiP);
  }

  if(aiMode==='creative'){
    // MCTS — always check immediate win/block first for safety
    const opp=aiP===BLACK?WHITE:BLACK;
    const cands=getCandidates(b,aiP);
    for(const[r,c]of cands){b[r][c]=aiP;const w=checkWin(b,r,c,aiP);b[r][c]=EMPTY;if(w)return[r,c];}
    for(const[r,c]of cands){b[r][c]=opp;const w=checkWin(b,r,c,opp);b[r][c]=EMPTY;if(w)return[r,c];}
    return mcts(b, aiP, getTimeMs());
  }

  return computeMinimaxMove(b, aiP);
}

// ── Layout & Drawing ──────────────────────────────────────────────────────────
function calcLayout(){
  const max=Math.min(window.innerWidth-16,window.innerHeight*0.78,560);
  CELL=Math.floor(max/(SIZE+1));PAD=CELL;STONE=Math.round(CELL*0.42);BP=(SIZE-1)*CELL;boardPx=BP+PAD*2;
  const wrap=document.getElementById('board-wrap');
  wrap.style.width=boardPx+'px';wrap.style.height=boardPx+'px';
  ['grid','stones'].forEach(id=>{
    const c=document.getElementById(id);
    c.width=boardPx;c.height=boardPx;c.style.width=boardPx+'px';c.style.height=boardPx+'px';
  });
  document.getElementById('hit').style.cssText=`width:${boardPx}px;height:${boardPx}px;`;
}
function drawGrid(){
  const ctx=document.getElementById('grid').getContext('2d');
  ctx.clearRect(0,0,boardPx,boardPx);ctx.strokeStyle='#7a4500';
  for(let i=0;i<SIZE;i++){
    ctx.lineWidth=(i===0||i===SIZE-1)?2:0.8;ctx.globalAlpha=0.75;
    ctx.beginPath();ctx.moveTo(PAD+i*CELL,PAD);ctx.lineTo(PAD+i*CELL,PAD+BP);ctx.stroke();
    ctx.beginPath();ctx.moveTo(PAD,PAD+i*CELL);ctx.lineTo(PAD+BP,PAD+i*CELL);ctx.stroke();
  }
  [[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]].forEach(([r,c])=>{
    ctx.globalAlpha=0.85;ctx.fillStyle='#7a4500';
    ctx.beginPath();ctx.arc(PAD+c*CELL,PAD+r*CELL,Math.max(3,CELL*0.1),0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}
function drawStones(){
  const ctx=document.getElementById('stones').getContext('2d');
  ctx.clearRect(0,0,boardPx,boardPx);
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(board[r][c]===EMPTY)continue;
    const x=PAD+c*CELL,y=PAD+r*CELL;
    const isW=winLine&&winLine.some(([wr,wc])=>wr===r&&wc===c);
    ctx.shadowColor=isW?'#f0d080':'#000';ctx.shadowBlur=isW?12:5;
    const g=ctx.createRadialGradient(x-STONE*0.3,y-STONE*0.3,STONE*0.1,x,y,STONE);
    if(board[r][c]===BLACK){g.addColorStop(0,'#777');g.addColorStop(0.6,'#111');g.addColorStop(1,'#000');}
    else{g.addColorStop(0,'#fff');g.addColorStop(0.5,'#e0e0e0');g.addColorStop(1,'#bbb');}
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,STONE,0,Math.PI*2);ctx.fill();
    if(isW){ctx.shadowBlur=0;ctx.strokeStyle='#f0d080';ctx.lineWidth=3;ctx.stroke();}
    ctx.shadowBlur=0;
  }
  if(lastMove&&!winner){
    const[lr,lc]=lastMove;
    ctx.fillStyle='#e05030';
    ctx.beginPath();ctx.arc(PAD+lc*CELL,PAD+lr*CELL,CELL*0.12,0,Math.PI*2);ctx.fill();
  }
}
function buildHitTargets(){
  const hit=document.getElementById('hit');hit.innerHTML='';
  if(winner||thinking)return;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(board[r][c]!==EMPTY)continue;
    const d=document.createElement('div');
    d.style.cssText=`position:absolute;left:${PAD+c*CELL-CELL/2}px;top:${PAD+r*CELL-CELL/2}px;width:${CELL}px;height:${CELL}px;`;
    d.dataset.r=r;d.dataset.c=c;d.addEventListener('click',onCellClick);
    hit.appendChild(d);
  }
}
function render(){drawStones();buildHitTargets();updateStatus();}

// ── AI runner ──────────────────────────────────────────────────────────────────
function runAI(){
  if(aiTimer)clearTimeout(aiTimer);
  thinking=true;updateStatus();buildHitTargets();
  const snap=board.map(r=>[...r]);
  aiTimer=setTimeout(()=>{
    const wb=snap.map(r=>[...r]);
    const[ar,ac]=computeAIMove(wb,WHITE);
    board[ar][ac]=WHITE;lastMove=[ar,ac];moveCount++;
    if(checkWin(board,ar,ac,WHITE)){
      winner=WHITE;winLine=getWinLine(board,ar,ac,WHITE);scoreW++;starter=starter===BLACK?WHITE:BLACK;
    } else { current=BLACK; }
    thinking=false;render();
  }, aiMode==='simple'?80:50); // MCTS/minimax runs inside timeout
}

// ── Input ──────────────────────────────────────────────────────────────────────
function onCellClick(e){
  const r=+e.currentTarget.dataset.r,c=+e.currentTarget.dataset.c;
  if(winner||board[r][c]!==EMPTY||thinking)return;
  board[r][c]=current;lastMove=[r,c];moveCount++;
  if(checkWin(board,r,c,current)){
    winner=current;winLine=getWinLine(board,r,c,current);
    if(current===BLACK) scoreB++; else scoreW++;
    starter = starter===BLACK ? WHITE : BLACK; // always alternate
    render();return;
  }
  current=current===BLACK?WHITE:BLACK;
  render();
  if(mode==='pvc'&&current===WHITE)runAI();
}

// ── Game control ───────────────────────────────────────────────────────────────
function createBoard(){return Array(SIZE).fill(null).map(()=>new Array(SIZE).fill(EMPTY));}
function startGame(s){
  if(aiTimer){clearTimeout(aiTimer);aiTimer=null;}
  board=createBoard();winner=null;winLine=null;lastMove=null;thinking=false;moveCount=0;
  if(aiMode==='master')pickOpening();
  if(s===WHITE){board[7][7]=WHITE;lastMove=[7,7];moveCount=1;current=BLACK;}
  else{current=BLACK;}
  render();
}
function resetGame(){ startGame(starter); }
function resetScores(){ scoreB=0;scoreW=0;starter=BLACK;startGame(BLACK); }
function setMode(m){
  mode=m;
  document.getElementById('btn-pvp').className='mode-btn'+(m==='pvp'?' active':'');
  document.getElementById('btn-pvc').className='mode-btn'+(m==='pvc'?' active':'');
  document.getElementById('ai-row').style.display=m==='pvc'?'flex':'none';
  document.getElementById('speed-row').style.display=m==='pvc'?'flex':'none';
  starter=BLACK;startGame(BLACK);
}

// ── Init ────────────────────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{calcLayout();drawGrid();render();});
calcLayout();drawGrid();
setLang('de');
setMode('pvc');
setAI('simple');
setSpeed('slow');
startGame(BLACK);
</script>
