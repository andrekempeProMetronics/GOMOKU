<body>

<script>
// ── Translations ──────────────────────────────────────────────────────────────
const LANGS={
  de:{pvp:'2 Spieler',pvc:'vs Computer',you:'Du',ai:'Computer',black:'Schwarz',white:'Weiß',
      turn:'Am Zug',thinking:'Rechnet…',wins:'gewinnt!',opens:'eröffnet',

      speed:'Tempo:',fast:'Normal',slow:'Stark'},
  en:{pvp:'2 Players',pvc:'vs Computer',you:'You',ai:'Computer',black:'Black',white:'White',
      turn:'Turn',thinking:'Thinking…',wins:'wins!',opens:'opens',
      new:'↺ New',reset:'Reset scores',ai_simple:'🎯 Simple',ai_master:'👑 Master',ai_creative:'🎨 Creative',
      speed:'Speed:',fast:'Normal',slow:'Strong'},
  ja:{pvp:'2人対戦',pvc:'vsコンピュータ',you:'あなた',ai:'コンピュータ',black:'黒',white:'白',
      turn:'番',thinking:'計算中…',wins:'勝ち！',opens:'が先手',
      new:'↺ 新規',reset:'リセット',ai_simple:'🎯 簡単',ai_master:'👑 達人',ai_creative:'🎨 創造',
      speed:'速度:',fast:'普通',slow:'強い'},
  zh:{pvp:'双人对战',pvc:'vs电脑',you:'你',ai:'电脑',black:'黑',white:'白',
      turn:'轮到',thinking:'计算中…',wins:'获胜！',opens:'先手',
      new:'↺ 新游戏',reset:'重置',ai_simple:'🎯 简单',ai_master:'👑 大师',ai_creative:'🎨 创意',
      speed:'速度:',fast:'普通',slow:'强力'},
  el:{pvp:'2 Παίκτες',pvc:'vs Υπολογιστής',you:'Εσύ',ai:'Υπολογιστής',black:'Μαύρος',white:'Άσπρος',
      turn:'Σειρά',thinking:'Υπολογίζει…',wins:'κερδίζει!',opens:'ανοίγει',
      new:'↺ Νέο',reset:'Μηδενισμός',ai_simple:'🎯 Απλό',ai_master:'👑 Μάστερ',ai_creative:'🎨 Δημιουργικό',
      speed:'Ταχύτητα:',fast:'Κανονικό',slow:'Δυνατό'},
  pl:{pvp:'2 Graczy',pvc:'vs Komputer',you:'Ty',ai:'Komputer',black:'Czarny',white:'Biały',
      turn:'Ruch',thinking:'Oblicza…',wins:'wygrywa!',opens:'zaczyna',
      new:'↺ Nowa',reset:'Reset',ai_simple:'🎯 Prosty',ai_master:'👑 Mistrz',ai_creative:'🎨 Kreatywny',
      speed:'Tempo:',fast:'Normalne',slow:'Mocne'}
};
let currentLang='de';
function t(k){return LANGS[currentLang][k]||LANGS.de[k];}
function setLang(l){
  currentLang=l;document.documentElement.lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('lang-'+l).classList.add('active');
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t);});
  document.querySelector('#btn-pvp span').textContent=t('pvp');
  document.querySelector('#btn-pvc span').textContent=t('pvc');
  updateStatus();
}
function playerLabel(p){return mode==='pvc'?(p===BLACK?t('you'):t('ai')):(p===BLACK?t('black'):t('white'));}
function playerIcon(p){return p===BLACK?'⚫':'⚪';}
function updateStatus(){
  const el=document.getElementById('status');
  if(winner){
    const nx=winner===BLACK?WHITE:BLACK;
    el.textContent=`🏆 ${playerIcon(winner)} ${playerLabel(winner)} ${t('wins')} — ${playerIcon(nx)} ${playerLabel(nx)} ${t('opens')}`;
    el.className='status win';
  } else if(thinking){
    const icon=aiMode==='simple'?'🎯':aiMode==='master'?'👑':'🎨';
    el.textContent=`${icon} ${t('thinking')}`;el.className='status';
  } else {
    el.textContent=`${t('turn')}: ${playerIcon(current)} ${playerLabel(current)}`;el.className='status';
  }
  document.getElementById('board-wrap').className=winner?'done':thinking?'thinking':'';
  document.getElementById('score-b').textContent=scoreB;
  document.getElementById('score-w').textContent=scoreW;
  document.getElementById('score-b').className='score-num'+(winner===BLACK?' winner':'');
  document.getElementById('score-w').className='score-num'+(winner===WHITE?' winner':'');
  document.getElementById('label-b').textContent='⚫ '+playerLabel(BLACK);
  document.getElementById('label-w').textContent='⚪ '+playerLabel(WHITE);
}

// ── Constants ─────────────────────────────────────────────────────────────────
const SIZE=15,EMPTY=0,BLACK=1,WHITE=2,WIN=5,MAX_CANDS=15;
let board,current,winner,winLine,lastMove,thinking,moveCount;
let scoreB=0,scoreW=0,starter=BLACK,mode='pvc',aiMode='simple',speed='fast';
let CELL,PAD,STONE,BP,boardPx,aiTimer=null;

// Time budgets per mode+speed (ms)
const TIME_BUDGET={
  simple:{fast:600,  slow:1500},
  master:{fast:1200, slow:3000},
  creative:{fast:1000,slow:3000}
};
function getTimeMs(){return TIME_BUDGET[aiMode][speed];}

function setAI(m){
  aiMode=m;
  ['simple','master','creative'].forEach(x=>{
    document.getElementById('ai-'+x).className='ai-btn'+(m===x?' active':'');
  });
  resetGame();
}
function setSpeed(s){
  speed=s;
  document.getElementById('spd-fast').className='speed-btn'+(s==='fast'?' active':'');
  document.getElementById('spd-slow').className='speed-btn'+(s==='slow'?' active':'');
}

// ── Pattern weights ───────────────────────────────────────────────────────────
// PAT[count][openEnds] — aggressive weights to prefer attacking
const PAT=[
  [0,0,0],
  [0,10,20],
  [0,150,500],
  [0,2000,10000],
  [0,20000,200000],
  [600000,600000,600000]
];

// ── Core helpers ──────────────────────────────────────────────────────────────
function checkWin(b,r,c,p){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    let n=1;
    for(let s=1;s<WIN;s++){const nr=r+dr*s,nc=c+dc*s;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==p)break;n++;}
    for(let s=1;s<WIN;s++){const nr=r-dr*s,nc=c-dc*s;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==p)break;n++;}
    if(n>=WIN)return true;
  }
  return false;
}
function getWinLine(b,r,c,p){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    let cells=[[r,c]];
    for(let s=1;s<WIN;s++){const nr=r+dr*s,nc=c+dc*s;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==p)break;cells.push([nr,nc]);}
    for(let s=1;s<WIN;s++){const nr=r-dr*s,nc=c-dc*s;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==p)break;cells.push([nr,nc]);}
    if(cells.length>=WIN)return cells;
  }
  return null;
}

// ── Evaluation ────────────────────────────────────────────────────────────────
function lineScore(b,r,c,dr,dc,p){
  const opp=p===BLACK?WHITE:BLACK;
  let cnt=1,oe=0,sp=1;
  let nr=r+dr,nc=c+dc;
  while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===p){cnt++;sp++;nr+=dr;nc+=dc;}
  if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===EMPTY){oe++;sp++;}
  nr=r-dr;nc=c-dc;
  while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===p){cnt++;sp++;nr-=dr;nc-=dc;}
  if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===EMPTY){oe++;sp++;}
  if(sp<WIN||oe===0)return 0;
  return PAT[Math.min(cnt,5)][oe];
}

function evalBoard(b,aiP){
  const opp=aiP===BLACK?WHITE:BLACK;
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  let score=0;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(b[r][c]===EMPTY)continue;
    const p=b[r][c];
    // Reward our own chains slightly more to encourage active offense,
    // while still respecting defense (opp threats weighted 1.15).
    const mul=p===aiP?1.1:-1.15;
    for(const[dr,dc]of dirs){
      const pr=r-dr,pc=c-dc;
      if(pr>=0&&pr<SIZE&&pc>=0&&pc<SIZE&&b[pr][pc]===p)continue;
      score+=mul*lineScore(b,r,c,dr,dc,p);
    }
  }
  // center gravity
  for(let r=3;r<12;r++) for(let c=3;c<12;c++){
    if(b[r][c]===aiP) score+=3;
    else if(b[r][c]===opp) score-=3;
  }
  // adjacency shaping: connected own stones on lines with potential
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(b[r][c]!==aiP)continue;
    if(!moveHasPotential(b,r,c,aiP))continue; // only count stones on live lines
    for(let dr=0;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(dr===0&&dc<=0)continue;
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===aiP)score+=5;
    }
  }
  return score;
}

// Count empty cells where placing aiP would extend toward a live (open) line.
// Used to detect "dead" moves that build chains with no winning potential.
function moveHasPotential(b,r,c,p){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    // count run length + reachable space in this direction
    let cnt=1,sp=1;
    let nr=r+dr,nc=c+dc;
    while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&(b[nr][nc]===p||b[nr][nc]===EMPTY)){if(b[nr][nc]===p)cnt++;sp++;if(sp>=WIN)break;nr+=dr;nc+=dc;}
    let sp2=sp;
    nr=r-dr;nc=c-dc;
    while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&(b[nr][nc]===p||b[nr][nc]===EMPTY)){if(b[nr][nc]===p)cnt++;sp2++;if(sp2>=WIN)break;nr-=dr;nc-=dc;}
    if(sp2>=WIN)return true; // this line can still reach 5
  }
  return false;
}

// ── Threat at empty cell ───────────────────────────────────────────────────────
function threatAt(b,r,c,p){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  let total=0;
  for(const[dr,dc]of dirs){
    let cF=0,cB=0,oF=0,oB=0,sF=1,sB=0;
    let nr=r+dr,nc=c+dc;
    while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===p){cF++;sF++;nr+=dr;nc+=dc;}
    if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===EMPTY){oF=1;sF++;}
    nr=r-dr;nc=c-dc;
    while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===p){cB++;sB++;nr-=dr;nc-=dc;}
    if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===EMPTY){oB=1;sB++;}
    if(sF+sB<WIN)continue;
    const tv=cF+cB+1,oe=oF+oB;
    if(oe>0)total+=PAT[Math.min(tv,5)][oe];
  }
  return total;
}

// ── Candidate generation ──────────────────────────────────────────────────────
function getCandidates(b,aiP){
  const opp=aiP===BLACK?WHITE:BLACK;
  const seen=new Uint8Array(SIZE*SIZE),out=[];
  const dirs4=[[1,0],[0,1],[1,1],[1,-1]];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(b[r][c]===EMPTY)continue;
    for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++){
      if(!dr&&!dc)continue;
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==EMPTY)continue;
      const i=nr*SIZE+nc;if(!seen[i]){seen[i]=1;out.push([nr,nc]);}
    }
    for(const[dr,dc]of dirs4){
      let nr=r+dr,nc=c+dc;
      while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===b[r][c]){nr+=dr;nc+=dc;}
      if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===EMPTY){const i=nr*SIZE+nc;if(!seen[i]){seen[i]=1;out.push([nr,nc]);}}
      nr=r-dr;nc=c-dc;
      while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===b[r][c]){nr-=dr;nc-=dc;}
      if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===EMPTY){const i=nr*SIZE+nc;if(!seen[i]){seen[i]=1;out.push([nr,nc]);}}
    }
  }
  if(!out.length)return[[7,7]];
  const sc=out.map(([r,c])=>{
    const atk=threatAt(b,r,c,aiP);
    const def=threatAt(b,r,c,opp)*1.1;
    let s=Math.max(atk,def);
    // Penalize offensive moves that have no path to 5 (dead shapes)
    if(atk>=def && atk>0 && !moveHasPotential(b,r,c,aiP)) s*=0.15;
    // Tiebreaker for quiet positions: prefer cells adjacent to OWN stones and
    // closer to center. Tiny weight so it never overrides real threats.
    let ownAdj=0;
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc)continue;
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===aiP)ownAdj++;
    }
    const centerDist=Math.abs(r-7)+Math.abs(c-7);
    s += ownAdj*3 + (14-centerDist)*0.5;
    return {r,c,s};
  });
  sc.sort((a,b)=>b.s-a.s);
  return sc.slice(0,MAX_CANDS).map(({r,c})=>[r,c]);
}

// ── Transposition table ───────────────────────────────────────────────────────
const TT=new Map();
const ZOBRIST=[];
(()=>{for(let r=0;r<SIZE;r++){ZOBRIST[r]=[];for(let c=0;c<SIZE;c++){ZOBRIST[r][c]=[Math.random()*2**32|0,Math.random()*2**32|0];}}})();
let zobristHash=0;
function ttKey(b){
  let h=0;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(b[r][c]!==EMPTY) h^=ZOBRIST[r][c][b[r][c]-1];
  return h;
}
const TT_EXACT=0,TT_LOWER=1,TT_UPPER=2;

// ── Killer moves ──────────────────────────────────────────────────────────────
const killers=Array(20).fill(null).map(()=>[null,null]);
function storeKiller(depth,move){
  if(move&&(!killers[depth][0]||(killers[depth][0][0]!==move[0]||killers[depth][0][1]!==move[1]))){
    killers[depth][1]=killers[depth][0];killers[depth][0]=move;
  }
}

// ── Minimax with all optimisations ────────────────────────────────────────────
let searchDeadline=0;
let bestMoveAtDepth=null;

function minimax(b,depth,alpha,beta,max,aiP,lR,lC,lP){
  // Time check every 256 nodes
  if((++nodeCount&255)===0&&Date.now()>searchDeadline)throw 'timeout';

  if(lR!==null&&checkWin(b,lR,lC,lP))return max?-700000-depth:700000+depth;
  if(depth===0)return evalBoard(b,aiP);

  // Transposition table lookup
  const key=ttKey(b);
  const tte=TT.get(key);
  if(tte&&tte.depth>=depth){
    if(tte.flag===TT_EXACT)return tte.score;
    if(tte.flag===TT_LOWER&&tte.score>alpha)alpha=tte.score;
    if(tte.flag===TT_UPPER&&tte.score<beta)beta=tte.score;
    if(alpha>=beta)return tte.score;
  }

  const cur=max?aiP:(aiP===BLACK?WHITE:BLACK);
  let cands=getCandidates(b,aiP);

  // Move ordering: killers first
  const k0=killers[depth][0],k1=killers[depth][1];
  cands.sort((a,b)=>{
    const aK=(k0&&a[0]===k0[0]&&a[1]===k0[1])?-2:(k1&&a[0]===k1[0]&&a[1]===k1[1])?-1:0;
    const bK=(k0&&b[0]===k0[0]&&b[1]===k0[1])?-2:(k1&&b[0]===k1[0]&&b[1]===k1[1])?-1:0;
    return aK-bK;
  });

  let best=max?-Infinity:Infinity;
  let bestMove=null;
  const origAlpha=alpha;

  for(const[r,c]of cands){
    b[r][c]=cur;
    let v;
    try{ v=minimax(b,depth-1,alpha,beta,!max,aiP,r,c,cur); }
    catch(e){ b[r][c]=EMPTY; throw e; }
    b[r][c]=EMPTY;
    if(max){
      if(v>best){best=v;bestMove=[r,c];}
      if(v>alpha)alpha=v;
    } else {
      if(v<best){best=v;bestMove=[r,c];}
      if(v<beta)beta=v;
    }
    if(beta<=alpha){ storeKiller(depth,[r,c]); break; }
  }

  // Store in TT
  const flag=best<=origAlpha?TT_UPPER:best>=beta?TT_LOWER:TT_EXACT;
  TT.set(key,{score:best,depth,flag});
  if(TT.size>200000)TT.clear(); // prevent memory bloat

  if(max&&depth===currentSearchDepth)bestMoveAtDepth=bestMove;
  return best;
}

// ── Iterative deepening ───────────────────────────────────────────────────────
let nodeCount=0;
let currentSearchDepth=0;

function iterativeDeepening(b,aiP,timeMs,variety){
  searchDeadline=Date.now()+timeMs;
  TT.clear();
  killers.forEach(k=>{k[0]=null;k[1]=null;});

  let bestMove=getCandidates(b,aiP)[0];
  let moveScores=[]; // for variety mode: [move, score] of root moves at last completed depth

  for(let depth=1;depth<=12;depth++){
    currentSearchDepth=depth;
    nodeCount=0;
    bestMoveAtDepth=null;
    const rootScores=[];
    try{
      // root-level search with score collection
      const cands=getCandidates(b,aiP);
      let alpha=-Infinity,best=-Infinity;
      for(const[r,c]of cands){
        b[r][c]=aiP;
        const v=minimax(b,depth-1,alpha,Infinity,false,aiP,r,c,aiP);
        b[r][c]=EMPTY;
        rootScores.push({move:[r,c],score:v});
        if(v>best){best=v;bestMoveAtDepth=[r,c];}
        if(v>alpha)alpha=v;
      }
      if(bestMoveAtDepth)bestMove=bestMoveAtDepth;
      moveScores=rootScores;
    } catch(e){ break; }
    if(bestMoveAtDepth){
      b[bestMoveAtDepth[0]][bestMoveAtDepth[1]]=aiP;
      const isWin=checkWin(b,bestMoveAtDepth[0],bestMoveAtDepth[1],aiP);
      b[bestMoveAtDepth[0]][bestMoveAtDepth[1]]=EMPTY;
      if(isWin)break;
    }
  }

  // Variety mode: only diversify among GENUINELY equal top moves (tight 4% band).
  // Never sacrifice strength — if the best move is clearly ahead, play it.
  if(variety&&moveScores.length>1){
    moveScores.sort((a,b)=>b.score-a.score);
    const top=moveScores[0].score;
    // forced/tactical positions: always best move
    if(top>=PAT[3][2]) return moveScores[0].move;
    // tight band: only moves within 4% (and at least positive)
    const band=Math.abs(top)*0.04+10;
    const equal=moveScores.filter(m=>m.score>=top-band);
    const pick=equal[Math.floor(Math.random()*Math.min(2,equal.length))];
    return pick.move;
  }

  return bestMove;
}

// ── Tactical pre-scan ─────────────────────────────────────────────────────────
// Find every empty cell where placing `p` creates 5-in-a-row (a winning/blocking spot)
function findWinningSpots(b,p){
  const spots=[];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(b[r][c]!==EMPTY)continue;
    b[r][c]=p;
    if(checkWin(b,r,c,p))spots.push([r,c]);
    b[r][c]=EMPTY;
  }
  return spots;
}

function tacticalMove(b,aiP){
  const opp=aiP===BLACK?WHITE:BLACK;

  // 1. Can WE win immediately? (scan entire board, not just candidates)
  const myWins=findWinningSpots(b,aiP);
  if(myWins.length)return myWins[0];

  // 2. Must we block opponent's immediate win? (any 5-completion spot)
  const oppWins=findWinningSpots(b,opp);
  if(oppWins.length)return oppWins[0];

  const cands=getCandidates(b,aiP);

  // 3. Block opponent open/half-open four (threat that becomes a win next move)
  let bB=null,bBs=0;
  for(const[r,c]of cands){const s=threatAt(b,r,c,opp);if(s>=PAT[4][1]&&s>bBs){bBs=s;bB=[r,c];}}
  if(bB)return bB;

  // 4. Create our own four (forcing)
  for(const[r,c]of cands){const s=threatAt(b,r,c,aiP);if(s>=PAT[4][1])return[r,c];}

  // 5. Block opponent fork (two simultaneous threes/fours)
  let bF=null,bFs=0;
  for(const[r,c]of cands){const s=threatAt(b,r,c,opp);if(s>=PAT[3][2]*2&&s>bFs){bFs=s;bF=[r,c];}}
  if(bF)return bF;

  // 6. Create our own fork
  for(const[r,c]of cands){const s=threatAt(b,r,c,aiP);if(s>=PAT[3][2]*2)return[r,c];}

  // 7. Block ONLY genuinely open threes — those that can still become an open four.
  //    A three already blocked on one side is harmless; don't waste a move on it.
  let bT=null,bTs=0;
  for(const[r,c]of cands){
    if(!createsOpenThreeThreat(b,r,c,opp))continue;
    const s=threatAt(b,r,c,opp);
    if(s>bTs){bTs=s;bT=[r,c];}
  }
  if(bT)return bT;

  return null;
}

// True if opponent has any connected chain of length >= n that can still reach 5.
function opponentHasChain(b,aiP,n){
  const opp=aiP===BLACK?WHITE:BLACK;
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(b[r][c]!==opp)continue;
    for(const[dr,dc]of dirs){
      const pr=r-dr,pc=c-dc;
      if(pr>=0&&pr<SIZE&&pc>=0&&pc<SIZE&&b[pr][pc]===opp)continue; // not chain start
      let cnt=1,nr=r+dr,nc=c+dc;
      while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===opp){cnt++;nr+=dr;nc+=dc;}
      if(cnt>=n)return true;
    }
  }
  return false;
}

// Returns true only if the opponent has a genuinely OPEN three that, if left
// alone, escalates to an open four. Such a three has BOTH ends open. The cell
// (r,c) is considered a worthwhile block if it sits on one of those open ends.
// A three already blocked on one side cannot become an open four → not urgent.
function createsOpenThreeThreat(b,r,c,p){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    // (r,c) is empty. Look at the opponent run starting immediately on one side;
    // this cell is an "end". For it to matter, the run must be exactly an open 3:
    //   pattern along this direction:  (r,c)=block-end, then p,p,p, then EMPTY
    // i.e. the three is open on the FAR side too.
    let run=0,nr=r+dr,nc=c+dc;
    while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===p){run++;nr+=dr;nc+=dc;}
    // nr,nc now points just past the run on the far side
    const farOpen=(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]===EMPTY);
    // For an OPEN three: run of exactly 3 with the far end ALSO open.
    // (r,c) itself is the near open end. Both ends open ⇒ blocking here matters.
    if(run===3 && farOpen) return true;
    // Broken three: p,p,EMPTY,p  or  p,EMPTY,p,p along this ray with far open.
    // Detect by scanning a small window for "3 stones + gap, both ends open".
    if(run===2){
      // after 2 stones we need: gap then 1 more stone then open  (X X _ X _) viewed from (r,c)
      const g1r=nr,g1c=nc; // the gap cell (must be empty)
      if(g1r>=0&&g1r<SIZE&&g1c>=0&&g1c<SIZE&&b[g1r][g1c]===EMPTY){
        const a=g1r+dr,bcol=g1c+dc;
        if(a>=0&&a<SIZE&&bcol>=0&&bcol<SIZE&&b[a][bcol]===p){
          const e=a+dr,f=bcol+dc;
          if(e>=0&&e<SIZE&&f>=0&&f<SIZE&&b[e][f]===EMPTY) return true;
        }
      }
    }
  }
  return false;
}

// ── Opening book ──────────────────────────────────────────────────────────────
const OPENINGS=[
  [[7,7],[7,8],[7,6],[8,7],[6,7],[8,8],[6,6],[9,7],[5,7],[9,9],[5,5]],
  [[7,7],[6,7],[8,7],[7,6],[7,8],[6,6],[8,8],[5,7],[9,7],[5,5],[9,9]],
  [[7,7],[7,6],[7,8],[6,7],[8,7],[5,7],[9,7],[6,6],[8,8],[4,7],[10,7]],
  [[7,7],[8,8],[6,6],[8,6],[6,8],[9,7],[5,7],[9,9],[5,5],[10,7],[4,7]],
  [[7,7],[6,8],[8,6],[6,6],[8,8],[5,9],[9,5],[5,5],[9,9],[4,10],[10,4]],
  [[7,7],[7,8],[8,7],[6,8],[8,6],[5,7],[9,7],[6,6],[8,8],[4,6],[10,8]],
  [[7,7],[8,7],[7,8],[9,7],[7,6],[10,7],[7,5],[9,8],[6,8],[11,7],[6,7]],
  [[7,7],[6,6],[8,8],[6,8],[8,6],[5,5],[9,9],[4,4],[10,10],[3,3],[11,11]],
];
let currentOpening=null;
function pickOpening(){currentOpening=OPENINGS[Math.floor(Math.random()*OPENINGS.length)];}
function getOpeningMove(b,sc){
  if(!currentOpening||sc>=currentOpening.length)return null;
  const[r,c]=currentOpening[sc];
  return b[r][c]===EMPTY?[r,c]:null;
}

// ── MCTS ─────────────────────────────────────────────────────────────────────
class Node{
  constructor(b,move,parent,player){
    this.b=b.map(r=>[...r]);this.move=move;this.parent=parent;this.player=player;
    this.children=[];this.w=0;this.n=0;this.untried=null;
  }
  ucb(c=1.4){return this.n===0?Infinity:this.w/this.n+c*Math.sqrt(Math.log(this.parent.n)/this.n);}
}
function mctsCands(b,p){
  const opp=p===BLACK?WHITE:BLACK,seen=new Uint8Array(SIZE*SIZE),out=[];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(b[r][c]===EMPTY)continue;
    for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++){
      if(!dr&&!dc)continue;
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==EMPTY)continue;
      const i=nr*SIZE+nc;if(!seen[i]){seen[i]=1;out.push([nr,nc]);}
    }
  }
  if(!out.length)return[[7,7]];
  const sc=out.map(([r,c])=>({r,c,s:Math.max(threatAt(b,r,c,p),threatAt(b,r,c,p===BLACK?WHITE:BLACK)*1.1)}));
  sc.sort((a,b)=>b.s-a.s);
  return sc.slice(0,10).map(({r,c})=>[r,c]);
}
function mctsPlay(b,p){
  let cur=p,bd=b.map(r=>[...r]);
  for(let i=0;i<30;i++){
    const ms=mctsCands(bd,cur).slice(0,5);
    if(!ms.length)break;
    const[r,c]=ms[Math.floor(Math.random()*ms.length)];
    bd[r][c]=cur;if(checkWin(bd,r,c,cur))return cur;
    cur=cur===BLACK?WHITE:BLACK;
  }
  return evalBoard(bd,WHITE)>0?WHITE:BLACK;
}
function mcts(b,aiP,ms){
  const root=new Node(b,null,null,aiP===BLACK?WHITE:BLACK);
  root.untried=mctsCands(b,aiP);
  const dl=Date.now()+ms;
  while(Date.now()<dl){
    let node=root;
    while(node.untried!==null&&node.untried.length===0&&node.children.length>0)
      node=node.children.reduce((a,b)=>a.ucb()>b.ucb()?a:b);
    if(node.untried===null)node.untried=mctsCands(node.b,aiP);
    if(node.untried.length>0){
      const idx=Math.floor(Math.random()*node.untried.length);
      const[r,c]=node.untried.splice(idx,1)[0];
      const nb=node.b.map(x=>[...x]);
      const np=node.player===BLACK?WHITE:BLACK;
      nb[r][c]=np;
      const child=new Node(nb,[r,c],node,np);
      child.untried=checkWin(nb,r,c,np)?[]:mctsCands(nb,np===BLACK?WHITE:BLACK);
      node.children.push(child);node=child;
    }
    let result;
    if(node.move&&checkWin(node.b,node.move[0],node.move[1],node.player))result=node.player;
    else result=mctsPlay(node.b,node.player===BLACK?WHITE:BLACK);
    let n=node;while(n){n.n++;if(n.player!==result)n.w++;n=n.parent;}
  }
  if(!root.children.length)return getCandidates(b,aiP)[0];
  return root.children.reduce((a,b)=>a.n>b.n?a:b).move;
}

// ── Opening move for any mode ─────────────────────────────────────────────────
function openingMove(b,aiP){
  const opp=aiP===BLACK?WHITE:BLACK;
  let best=null,bs=-Infinity;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(b[r][c]!==opp)continue;
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc)continue;
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==EMPTY)continue;
      const s=-(Math.abs(nr-7)+Math.abs(nc-7))+Math.random()*1.5;
      if(s>bs){bs=s;best=[nr,nc];}
    }
  }
  return best;
}

// ── Main AI dispatcher ────────────────────────────────────────────────────────
function computeAIMove(b,aiP){
  const sc=b.reduce((n,r)=>n+r.filter(c=>c!==EMPTY).length,0);
  if(sc===0)return[7,7];

  const tact=tacticalMove(b,aiP);

  if(aiMode==='simple'){
    if(tact)return tact;
    return iterativeDeepening(b.map(r=>[...r]),aiP,getTimeMs());
  }

  if(aiMode==='master'){
    if(tact)return tact;
    // Opening book ONLY for the very first few moves AND only while the
    // position is calm (no opponent chain of 3+ anywhere). As soon as the
    // game develops real structure, switch to full search.
    if(sc<=4 && !opponentHasChain(b,aiP,3)){
      const om=getOpeningMove(b,sc);
      if(om)return om;
    }
    return iterativeDeepening(b.map(r=>[...r]),aiP,getTimeMs());
  }

  if(aiMode==='creative'){
    if(tact)return tact;
    // Hybrid: full-strength minimax with variety among near-equal top moves
    return iterativeDeepening(b.map(r=>[...r]),aiP,getTimeMs(),true);
  }

  return getCandidates(b,aiP)[0];
}

// ── Layout & Drawing ──────────────────────────────────────────────────────────
function calcLayout(){
  const max=Math.min(window.innerWidth-16,window.innerHeight*0.78,560);
  CELL=Math.floor(max/(SIZE+1));PAD=CELL;STONE=Math.round(CELL*0.42);BP=(SIZE-1)*CELL;boardPx=BP+PAD*2;
  const wrap=document.getElementById('board-wrap');
  wrap.style.width=boardPx+'px';wrap.style.height=boardPx+'px';
  ['grid','stones'].forEach(id=>{
    const c=document.getElementById(id);
    c.width=boardPx;c.height=boardPx;c.style.width=boardPx+'px';c.style.height=boardPx+'px';
  });
  document.getElementById('hit').style.cssText=`width:${boardPx}px;height:${boardPx}px;`;
}
function drawGrid(){
  const ctx=document.getElementById('grid').getContext('2d');
  ctx.clearRect(0,0,boardPx,boardPx);ctx.strokeStyle='#7a4500';
  for(let i=0;i<SIZE;i++){
    ctx.lineWidth=(i===0||i===SIZE-1)?2:0.8;ctx.globalAlpha=0.75;
    ctx.beginPath();ctx.moveTo(PAD+i*CELL,PAD);ctx.lineTo(PAD+i*CELL,PAD+BP);ctx.stroke();
    ctx.beginPath();ctx.moveTo(PAD,PAD+i*CELL);ctx.lineTo(PAD+BP,PAD+i*CELL);ctx.stroke();
  }
  [[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]].forEach(([r,c])=>{
    ctx.globalAlpha=0.85;ctx.fillStyle='#7a4500';
    ctx.beginPath();ctx.arc(PAD+c*CELL,PAD+r*CELL,Math.max(3,CELL*0.1),0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}
function drawStones(){
  const ctx=document.getElementById('stones').getContext('2d');
  ctx.clearRect(0,0,boardPx,boardPx);
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(board[r][c]===EMPTY)continue;
    const x=PAD+c*CELL,y=PAD+r*CELL;
    const isW=winLine&&winLine.some(([wr,wc])=>wr===r&&wc===c);
    ctx.shadowColor=isW?'#f0d080':'#000';ctx.shadowBlur=isW?12:5;
    const g=ctx.createRadialGradient(x-STONE*0.3,y-STONE*0.3,STONE*0.1,x,y,STONE);
    if(board[r][c]===BLACK){g.addColorStop(0,'#777');g.addColorStop(0.6,'#111');g.addColorStop(1,'#000');}
    else{g.addColorStop(0,'#fff');g.addColorStop(0.5,'#e0e0e0');g.addColorStop(1,'#bbb');}
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,STONE,0,Math.PI*2);ctx.fill();
    if(isW){ctx.shadowBlur=0;ctx.strokeStyle='#f0d080';ctx.lineWidth=3;ctx.stroke();}
    ctx.shadowBlur=0;
  }
  if(lastMove&&!winner){
    const[lr,lc]=lastMove;
    ctx.fillStyle='#e05030';
    ctx.beginPath();ctx.arc(PAD+lc*CELL,PAD+lr*CELL,CELL*0.12,0,Math.PI*2);ctx.fill();
  }
}
function buildHitTargets(){
  const hit=document.getElementById('hit');hit.innerHTML='';
  if(winner||thinking)return;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(board[r][c]!==EMPTY)continue;
    const d=document.createElement('div');
    d.style.cssText=`position:absolute;left:${PAD+c*CELL-CELL/2}px;top:${PAD+r*CELL-CELL/2}px;width:${CELL}px;height:${CELL}px;`;
    d.dataset.r=r;d.dataset.c=c;d.addEventListener('click',onCellClick);
    hit.appendChild(d);
  }
}
function render(){drawStones();buildHitTargets();updateStatus();}

// ── AI runner ──────────────────────────────────────────────────────────────────
function runAI(){
  if(aiTimer)clearTimeout(aiTimer);
  thinking=true;updateStatus();buildHitTargets();
  const snap=board.map(r=>[...r]);
  aiTimer=setTimeout(()=>{
    const wb=snap.map(r=>[...r]);
    const[ar,ac]=computeAIMove(wb,WHITE);
    board[ar][ac]=WHITE;lastMove=[ar,ac];moveCount++;
    if(checkWin(board,ar,ac,WHITE)){
      winner=WHITE;winLine=getWinLine(board,ar,ac,WHITE);scoreW++;
      starter=starter===BLACK?WHITE:BLACK;
    } else {current=BLACK;}
    thinking=false;render();
  },30);
}

// ── Input ─────────────────────────────────────────────────────────────────────
function onCellClick(e){
  const r=+e.currentTarget.dataset.r,c=+e.currentTarget.dataset.c;
  if(winner||board[r][c]!==EMPTY||thinking)return;
  board[r][c]=current;lastMove=[r,c];moveCount++;
  if(checkWin(board,r,c,current)){
    winner=current;winLine=getWinLine(board,r,c,current);
    if(current===BLACK)scoreB++;else scoreW++;
    starter=starter===BLACK?WHITE:BLACK;
    render();return;
  }
  current=current===BLACK?WHITE:BLACK;
  render();
  if(mode==='pvc'&&current===WHITE)runAI();
}

// ── Game control ───────────────────────────────────────────────────────────────
function createBoard(){return Array(SIZE).fill(null).map(()=>new Array(SIZE).fill(EMPTY));}
function startGame(s){
  if(aiTimer){clearTimeout(aiTimer);aiTimer=null;}
  board=createBoard();winner=null;winLine=null;lastMove=null;thinking=false;moveCount=0;
  if(aiMode==='master')pickOpening();
  if(s===WHITE){board[7][7]=WHITE;lastMove=[7,7];moveCount=1;current=BLACK;}
  else{current=BLACK;}
  render();
}
function resetGame(){startGame(starter);}
function resetScores(){scoreB=0;scoreW=0;starter=BLACK;startGame(BLACK);}
function setMode(m){
  mode=m;
  document.getElementById('btn-pvp').className='mode-btn'+(m==='pvp'?' active':'');
  document.getElementById('btn-pvc').className='mode-btn'+(m==='pvc'?' active':'');
  document.getElementById('ai-row').style.display=m==='pvc'?'flex':'none';
  document.getElementById('speed-row').style.display=m==='pvc'?'flex':'none';
  starter=BLACK;startGame(BLACK);
}

// ── Init ───────────────────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{calcLayout();drawGrid();render();});
calcLayout();drawGrid();
setLang('de');setMode('pvc');setAI('simple');setSpeed('fast');
startGame(BLACK);
</script>
